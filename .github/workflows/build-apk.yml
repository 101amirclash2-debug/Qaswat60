name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          "$SDK/build-tools/34.0.0/aapt" version

      - name: Build the web app as one self-contained file
        run: npm run build:single

      - name: Build the APK
        run: node scripts/make-apk.mjs

      - name: Report and verify the APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ls -lh wadi-al-jabal.apk
          "$BT/aapt" dump badging wadi-al-jabal.apk | head -4
          "$BT/apksigner" verify --verbose wadi-al-jabal.apk | head -6
          # the embedded web app must be inside the apk
          unzip -l wadi-al-jabal.apk | grep -E "assets/www/index.html|classes.dex"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wadi-al-jabal-apk
          path: wadi-al-jabal.apk
          retention-days: 90

      - name: Publish APK on the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wadi-al-jabal.apk --clobber
          else
            gh release create "$TAG" wadi-al-jabal.apk \
              --title "Wadi Al-Jabal - latest APK" \
              --notes "Auto-built from commit ${GITHUB_SHA:0:7}. Download wadi-al-jabal.apk below and open it on Android (allow install from unknown sources). Fully offline."
          fi
          echo "release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
