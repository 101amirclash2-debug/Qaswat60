name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 3 -type d | head -80
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run protocol tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: fahes-car-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The execution sandbox cannot reach GitHub's artifact-storage host. Stage
      # this explicitly requested package on the active branch once so it can be
      # copied into the workspace and Drive; this step is removed after delivery.
      - name: Stage APK for delivery to Drive
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/FahesCar-1.0.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/FahesCar-1.0.0.apk
          git commit -m "Add requested installable APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
