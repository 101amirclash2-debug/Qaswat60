name: Build Qaswara.apk

on:
  push:
    branches: [main, develop, "arena/**"]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy the web UI into the APK assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/
          ls -la android/app/src/main/assets/www | head -30

      - name: Build
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Qaswara.apk
          ls -lh Qaswara.apk

      - name: Upload Qaswara.apk
        uses: actions/upload-artifact@v4
        with:
          name: Qaswara.apk
          path: Qaswara.apk
          retention-days: 30
